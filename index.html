<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>仮面ライダー言えるかな？ | KAMEN RIDER QUIZ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Noto+Sans+JP:wght@400;500;700;900&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans JP"', 'Inter', 'sans-serif'],
                        mono: ['"Orbitron"', 'monospace']
                    },
                    colors: {
                        rider: {
                            red: '#E60012',
                            crimson: '#99000D',
                            gold: '#F59E0B',
                            dark: '#0B0F17',
                            panel: '#151C28',
                            border: '#263147'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #080b11;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(230, 0, 18, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(245, 158, 11, 0.08) 0%, transparent 40%),
                linear-gradient(180deg, #080b11 0%, #0f1522 100%);
            background-attachment: fixed;
            color: #f3f4f6;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* ヒーロー風の斜めストライプ背景装飾 */
        .hero-stripes {
            background-image: repeating-linear-gradient(
                -45deg,
                rgba(255, 255, 255, 0.025),
                rgba(255, 255, 255, 0.025) 10px,
                transparent 10px,
                transparent 20px
            );
        }

        /* 名前表示用の画像枠風ディスプレイ背景 */
        .rider-name-frame {
            background: 
                radial-gradient(circle at 50% 35%, rgba(230, 0, 18, 0.22) 0%, rgba(15, 23, 42, 0.95) 75%),
                linear-gradient(135deg, #111827 0%, #090d16 100%);
        }

        .rider-name-frame-giveup {
            background: 
                radial-gradient(circle at 50% 35%, rgba(153, 27, 27, 0.25) 0%, rgba(15, 23, 42, 0.95) 75%),
                linear-gradient(135deg, #18181b 0%, #090d16 100%);
        }

        /* カードオープン時のアニメーション */
        @keyframes cardUnlock {
            0% {
                transform: scale(0.85) rotateY(90deg);
                box-shadow: 0 0 0 rgba(245, 158, 11, 0);
            }
            60% {
                transform: scale(1.06) rotateY(-5deg);
                box-shadow: 0 0 30px rgba(245, 158, 11, 0.8), 0 0 15px rgba(230, 0, 18, 0.6);
            }
            100% {
                transform: scale(1) rotateY(0deg);
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            }
        }

        @keyframes pulseHighlight {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(245, 158, 11, 0);
            }
            50% {
                transform: scale(1.07);
                box-shadow: 0 0 25px 6px rgba(245, 158, 11, 0.75);
            }
        }

        @keyframes shakeInput {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .animate-unlock {
            animation: cardUnlock 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .animate-already {
            animation: pulseHighlight 0.6s ease-in-out 2;
        }

        .animate-shake {
            animation: shakeInput 0.35s ease-in-out;
        }

        /* 2行省略表示用 */
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* スクロールバーのカスタマイズ */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0f17;
        }
        ::-webkit-scrollbar-thumb {
            background: #263147;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #E60012;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans selection:bg-rider-red selection:text-white">

    <!-- ==================== トップヘッダー ==================== -->
    <header class="border-b border-rider-border bg-rider-dark/95 backdrop-blur-md sticky top-0 z-40 shadow-2xl">
        <!-- 上段：タイトル＆ツールバー -->
        <div class="max-w-7xl mx-auto px-3 sm:px-6 py-2 flex items-center justify-between gap-2 border-b border-gray-800/80">
            <div>
                <h1 class="text-base sm:text-xl font-black tracking-tight text-white flex items-center gap-1.5">
                    仮面ライダー<span class="text-transparent bg-clip-text bg-gradient-to-r from-red-500 via-amber-400 to-yellow-300">言えるかな？</span>
                </h1>
            </div>

            <!-- 右側ツールボタン群（カードサイズ切替＆効果音ON/OFF） -->
            <div class="flex items-center gap-1.5 sm:gap-2">
                <!-- カードサイズ切替（スマホでも利用可能） -->
                <div class="flex items-center bg-gray-900 p-0.5 rounded-lg border border-gray-800">
                    <button data-size="sm" class="size-btn px-2 py-1 rounded text-xs text-gray-400 hover:text-white transition" title="コンパクト表示">
                        <i class="fa-solid fa-table-cells"></i>
                    </button>
                    <button data-size="md" class="size-btn px-2 py-1 rounded text-xs bg-gray-700 text-white transition" title="標準サイズ">
                        <i class="fa-solid fa-table-cells-large"></i>
                    </button>
                    <button data-size="lg" class="size-btn px-2 py-1 rounded text-xs text-gray-400 hover:text-white transition" title="大きめ表示">
                        <i class="fa-solid fa-square"></i>
                    </button>
                </div>

                <!-- 効果音ON/OFF -->
                <button id="soundToggleBtn" class="p-2 rounded-lg text-xs font-bold bg-slate-800 hover:bg-slate-700 text-amber-400 border border-slate-600/80 transition" title="効果音 ON/OFF">
                    <i id="soundIcon" class="fa-solid fa-volume-high"></i>
                </button>
            </div>
        </div>

        <!-- 下段：ゲーム操作・タイマー・入力バー -->
        <div class="max-w-7xl mx-auto px-3 sm:px-6 py-2.5 sm:py-3 hero-stripes">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-2.5 sm:gap-3 items-center">
                
                <!-- 左：タイマー＆進捗ステータス (4 cols) -->
                <div class="lg:col-span-4 flex items-center justify-between gap-2.5 bg-gray-950/90 border border-gray-800 px-3 py-1.5 sm:py-2 rounded-xl shadow-inner">
                    <!-- タイマー表示 -->
                    <div class="flex items-center gap-2">
                        <div id="timerIndicator" class="w-2.5 h-2.5 sm:w-3 sm:h-3 rounded-full bg-gray-600 transition-colors duration-300 shrink-0"></div>
                        <div>
                            <div class="text-[9px] sm:text-[10px] text-gray-400 font-bold tracking-wider uppercase leading-none">TIME</div>
                            <div id="timerDisplay" class="font-mono text-xl sm:text-3xl font-black text-white tracking-wider leading-tight">
                                00:00.<span class="text-sm sm:text-lg text-amber-400">00</span>
                            </div>
                        </div>
                    </div>

                    <div class="h-7 w-px bg-gray-800 shrink-0"></div>

                    <!-- スコア・進捗表示 -->
                    <div class="flex-1 min-w-[105px]">
                        <div class="flex justify-between items-baseline mb-1">
                            <span class="text-[10px] sm:text-[11px] text-gray-400 font-bold">解放数</span>
                            <span class="font-mono text-xs sm:text-base font-black text-amber-400">
                                <span id="correctCount" class="text-white text-base sm:text-lg">0</span> / <span id="totalCount">0</span>
                            </span>
                        </div>
                        <div class="w-full h-1.5 sm:h-2 bg-gray-800 rounded-full overflow-hidden p-0.5 border border-gray-700">
                            <div id="progressBar" class="h-full bg-gradient-to-r from-rider-red via-amber-500 to-yellow-300 rounded-full transition-all duration-300" style="width: 0%"></div>
                        </div>
                    </div>
                </div>

                <!-- 中央：ライダー名入力ボックス (5 cols) -->
                <div class="lg:col-span-5 relative">
                    <div class="relative flex items-center">
                        <div class="absolute left-3.5 text-gray-400 pointer-events-none">
                            <i class="fa-solid fa-bolt text-amber-400"></i>
                        </div>
                        <!-- text-base (16px) でスマホブラウザの入力時自動ズームを防止 -->
                        <input 
                            type="text" 
                            id="riderInput" 
                            placeholder="ライダー名を入力（省略OK）" 
                            disabled
                            autocomplete="off"
                            autocorrect="off"
                            autocapitalize="off"
                            enterkeyhint="done"
                            class="w-full pl-9 pr-16 py-2 sm:py-2.5 rounded-xl bg-gray-950 border-2 border-gray-700 text-white placeholder-gray-500 text-base font-bold focus:outline-none focus:border-amber-400 focus:ring-2 focus:ring-amber-400/20 disabled:opacity-60 disabled:cursor-not-allowed transition shadow-inner"
                        >
                        <button 
                            id="submitAnswerBtn" 
                            disabled
                            class="absolute right-1.5 px-3 py-1.5 rounded-lg bg-gradient-to-r from-rider-red to-red-700 hover:from-red-500 hover:to-red-600 text-white font-black text-xs sm:text-sm shadow disabled:opacity-40 disabled:pointer-events-none transition"
                        >
                            回答
                        </button>
                    </div>

                    <!-- フィードバックメッセージ＆自動判定オプション -->
                    <div class="flex flex-wrap items-center justify-between gap-x-2 gap-y-1 mt-1 px-1">
                        <div id="feedbackMessage" class="text-[11px] sm:text-xs font-bold text-gray-400 truncate max-w-full sm:max-w-[62%] min-h-[16px] flex items-center gap-1">
                            <span><i class="fa-solid fa-circle-info text-amber-400 mr-1"></i>「仮面ライダー」は省略して入力できます</span>
                        </div>
                        <div class="flex items-center gap-2.5 text-[11px] sm:text-xs text-gray-300 shrink-0 ml-auto">
                            <label class="inline-flex items-center gap-1 cursor-pointer select-none" title="入力中に一致したらEnter不要で即座に正解判定します">
                                <input type="checkbox" id="autoSubmitToggle" checked class="rounded bg-gray-800 border-gray-600 text-rider-red focus:ring-0 accent-red-600">
                                <span>自動判定</span>
                            </label>
                            <label class="inline-flex items-center gap-1 cursor-pointer select-none" title="正解したライダーのマスへ自動でスクロールします">
                                <input type="checkbox" id="autoScrollToggle" class="rounded bg-gray-800 border-gray-600 text-rider-red focus:ring-0 accent-red-600">
                                <span>自動スクロール</span>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- 右：スタート / ギブアップ / リセットボタン (3 cols) -->
                <div class="lg:col-span-3 flex items-center justify-end gap-2">
                    <!-- スタートボタン -->
                    <button id="startBtn" class="flex-1 sm:flex-initial inline-flex items-center justify-center gap-1.5 px-4 py-2 sm:py-2.5 rounded-xl font-black text-xs sm:text-sm text-white bg-gradient-to-r from-rider-red via-red-600 to-amber-500 hover:from-red-500 hover:to-amber-400 shadow-lg shadow-red-900/50 border border-red-400/40 transform active:scale-95 transition">
                        <i class="fa-solid fa-play"></i>
                        <span>スタート！</span>
                    </button>

                    <!-- ギブアップボタン -->
                    <button id="giveUpBtn" disabled class="flex-1 sm:flex-initial inline-flex items-center justify-center gap-1.5 px-3 py-2 sm:py-2.5 rounded-xl font-bold text-xs sm:text-sm text-amber-300 bg-amber-950/60 hover:bg-amber-900/70 border border-amber-700/60 disabled:opacity-40 disabled:pointer-events-none transition" title="タイマーを止めて未回答のライダーをすべて表示します">
                        <i class="fa-solid fa-flag"></i>
                        <span>ギブアップ</span>
                    </button>

                    <!-- リセットボタン -->
                    <button id="resetBtn" class="inline-flex items-center justify-center gap-1.5 px-3 py-2 sm:py-2.5 rounded-xl font-bold text-xs sm:text-sm text-gray-300 bg-gray-800 hover:bg-gray-700 border border-gray-700 transition" title="最初からやり直す">
                        <i class="fa-solid fa-rotate-right"></i>
                        <span class="hidden xl:inline">リセット</span>
                    </button>
                </div>

            </div>
        </div>
    </header>

    <!-- ==================== 出題条件＆ソート設定パネル ==================== -->
    <section class="max-w-7xl w-full mx-auto px-3 sm:px-6 pt-3 pb-1.5 space-y-2.5">
        <!-- メインチェックボックス群 -->
        <div class="p-2.5 sm:p-3.5 rounded-2xl bg-gray-900/90 border border-gray-800 shadow-lg flex flex-col gap-2.5">
            <div class="flex flex-wrap items-center justify-between gap-2">
                <div class="flex items-center gap-2 flex-wrap">
                    <span class="px-2 py-0.5 rounded bg-rider-red/20 border border-rider-red/40 text-red-400 text-[10px] sm:text-[11px] font-black tracking-wider">出題＆表示オプション</span>
                    <span id="filterLockNotice" class="hidden text-[10px] sm:text-[11px] text-amber-400 font-bold">
                        <i class="fa-solid fa-lock mr-1"></i>プレイ中は出題範囲の変更をロック中（シリーズソートは切替可）
                    </span>
                </div>
                <div class="text-[11px] sm:text-xs text-gray-400 font-medium">
                    対象ライダー: <span id="activePoolCountText" class="text-white font-black font-mono">0</span> 人
                </div>
            </div>

            <!-- チェックボックス5つを並べるメイン行（スマホでは押しやすいグリッド配置） -->
            <div class="grid grid-cols-2 sm:flex sm:flex-wrap items-center gap-1.5 sm:gap-2.5">
                <!-- 1. シリーズソート -->
                <label class="col-span-2 sm:col-span-1 cursor-pointer select-none inline-flex items-center justify-between sm:justify-start gap-2 px-3 py-2 rounded-xl bg-gray-950 hover:bg-gray-800/80 border border-gray-700 has-[:checked]:border-sky-500 has-[:checked]:bg-sky-950/40 transition">
                    <div class="flex items-center gap-1.5">
                        <input type="checkbox" id="chkSeriesSort" class="w-4 h-4 rounded accent-sky-500">
                        <i class="fa-solid fa-layer-group text-sky-400 text-xs"></i>
                        <span class="text-xs sm:text-sm font-bold text-gray-100">シリーズソート</span>
                    </div>
                    <span class="text-[10px] text-gray-400">初登場作品順</span>
                </label>

                <div class="h-6 w-px bg-gray-800 hidden sm:block"></div>

                <!-- 2. 映像化作品のみ -->
                <label id="labelVisualOnly" class="cursor-pointer select-none inline-flex items-center justify-between sm:justify-start gap-1.5 px-2.5 sm:px-3 py-2 rounded-xl bg-gray-950 hover:bg-gray-800/80 border border-gray-700 has-[:checked]:border-emerald-500 has-[:checked]:bg-emerald-950/40 transition">
                    <div class="flex items-center gap-1.5 min-w-0">
                        <input type="checkbox" id="chkVisualOnly" checked class="w-4 h-4 rounded accent-emerald-500 shrink-0">
                        <i class="fa-solid fa-film text-emerald-400 text-xs hidden sm:inline"></i>
                        <span class="text-xs sm:text-sm font-bold text-gray-100 truncate">映像化作品のみ</span>
                    </div>
                    <span id="countVisualOnly" class="px-1.5 py-0.2 rounded bg-black/40 font-mono text-[10px] text-emerald-300 shrink-0">0</span>
                </label>

                <!-- 3. 小説限定ライダー -->
                <label id="labelNovelOnly" class="cursor-pointer select-none inline-flex items-center justify-between sm:justify-start gap-1.5 px-2.5 sm:px-3 py-2 rounded-xl bg-gray-950 hover:bg-gray-800/80 border border-gray-700 has-[:checked]:border-amber-500 has-[:checked]:bg-amber-950/40 transition">
                    <div class="flex items-center gap-1.5 min-w-0">
                        <input type="checkbox" id="chkNovelOnly" class="w-4 h-4 rounded accent-amber-500 shrink-0">
                        <i class="fa-solid fa-book text-amber-400 text-xs hidden sm:inline"></i>
                        <span class="text-xs sm:text-sm font-bold text-gray-100 truncate">小説限定ライダー</span>
                    </div>
                    <span id="countNovelOnly" class="px-1.5 py-0.2 rounded bg-black/40 font-mono text-[10px] text-amber-300 shrink-0">0</span>
                </label>

                <!-- 4. 舞台限定ライダー -->
                <label id="labelStageOnly" class="cursor-pointer select-none inline-flex items-center justify-between sm:justify-start gap-1.5 px-2.5 sm:px-3 py-2 rounded-xl bg-gray-950 hover:bg-gray-800/80 border border-gray-700 has-[:checked]:border-purple-500 has-[:checked]:bg-purple-950/40 transition">
                    <div class="flex items-center gap-1.5 min-w-0">
                        <input type="checkbox" id="chkStageOnly" class="w-4 h-4 rounded accent-purple-500 shrink-0">
                        <i class="fa-solid fa-masks-theater text-purple-400 text-xs hidden sm:inline"></i>
                        <span class="text-xs sm:text-sm font-bold text-gray-100 truncate">舞台限定ライダー</span>
                    </div>
                    <span id="countStageOnly" class="px-1.5 py-0.2 rounded bg-black/40 font-mono text-[10px] text-purple-300 shrink-0">0</span>
                </label>

                <!-- 5. ゲーム限定ライダー -->
                <label id="labelGameOnly" class="cursor-pointer select-none inline-flex items-center justify-between sm:justify-start gap-1.5 px-2.5 sm:px-3 py-2 rounded-xl bg-gray-950 hover:bg-gray-800/80 border border-gray-700 has-[:checked]:border-pink-500 has-[:checked]:bg-pink-950/40 transition">
                    <div class="flex items-center gap-1.5 min-w-0">
                        <input type="checkbox" id="chkGameOnly" class="w-4 h-4 rounded accent-pink-500 shrink-0">
                        <i class="fa-solid fa-gamepad text-pink-400 text-xs hidden sm:inline"></i>
                        <span class="text-xs sm:text-sm font-bold text-gray-100 truncate">ゲーム限定ライダー</span>
                    </div>
                    <span id="countGameOnly" class="px-1.5 py-0.2 rounded bg-black/40 font-mono text-[10px] text-pink-300 shrink-0">0</span>
                </label>
            </div>
        </div>

        <!-- 下段：分類タブ ＆ 作品フィルタ ＆ 表示フィルター -->
        <div class="flex flex-wrap items-center justify-between gap-2">
            <!-- 分類絞り込みタブ -->
            <div class="flex flex-wrap items-center gap-1 sm:gap-1.5" id="eraFilterContainer">
                <!-- JSで動的に生成（すべて / 昭和 / 平成1期 / 平成2期 / 令和 ...） -->
            </div>

            <!-- 作品フィルタ＆状態フィルター＆ヒント切替 -->
            <div class="flex flex-wrap items-center gap-1.5 sm:gap-2 w-full sm:w-auto sm:ml-auto justify-end">
                <!-- 作品（C列：初登場作品）フィルター -->
                <div class="relative flex-1 sm:flex-initial min-w-[150px] max-w-full sm:max-w-[240px]">
                    <select id="workFilterSelect" class="w-full bg-gray-900 border border-gray-700 text-gray-200 text-xs font-bold rounded-lg px-2 sm:px-2.5 py-1.5 focus:outline-none focus:border-amber-400 disabled:opacity-50 disabled:cursor-not-allowed truncate">
                        <option value="ALL">すべての作品</option>
                    </select>
                </div>

                <!-- 状態フィルター -->
                <select id="statusFilterSelect" class="bg-gray-900 border border-gray-700 text-gray-200 text-xs font-bold rounded-lg px-2 sm:px-2.5 py-1.5 focus:outline-none focus:border-amber-400">
                    <option value="ALL">すべて表示</option>
                    <option value="UNANSWERED">未回答のみ</option>
                    <option value="ANSWERED">正解済みのみ</option>
                </select>

                <!-- ヒント表示トグル -->
                <button id="hintToggleBtn" class="px-2.5 py-1.5 rounded-lg text-xs font-bold bg-gray-900 hover:bg-gray-800 text-amber-400 border border-gray-700 transition flex items-center gap-1 shrink-0" title="未回答マスに初登場作品と頭文字ヒントを表示します">
                    <i class="fa-regular fa-lightbulb"></i>
                    <span>ヒント: OFF</span>
                </button>
            </div>
        </div>
    </section>

    <!-- ==================== メイン：ライダーグリッド一覧 ==================== -->
    <main class="max-w-7xl w-full mx-auto px-3 sm:px-6 py-3 flex-1">
        <!-- 直近で正解したライダーのミニティッカー -->
        <div id="recentHitBanner" class="hidden mb-3 px-3.5 py-2 rounded-xl bg-gradient-to-r from-amber-950/60 via-red-950/40 to-gray-900 border border-amber-500/40 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2 text-xs sm:text-sm min-w-0">
                <span class="px-2 py-0.5 rounded bg-amber-500 text-black font-black text-[10px] uppercase shrink-0">OPEN!</span>
                <span id="recentHitText" class="font-bold text-amber-200 truncate"></span>
            </div>
            <span id="recentHitSub" class="text-[11px] text-gray-400 font-mono shrink-0"></span>
        </div>

        <!-- シリーズソートON時／OFF時の描画コンテナ -->
        <div id="riderMainContainer" class="space-y-6">
            <!-- JSでカードまたは作品別グループを生成 -->
        </div>

        <!-- 該当なしメッセージ -->
        <div id="emptyStateMessage" class="hidden py-16 text-center bg-gray-900/40 rounded-2xl border border-gray-800/80 px-4">
            <i class="fa-solid fa-magnifying-glass text-4xl text-gray-600 mb-3"></i>
            <p class="text-gray-300 font-bold text-sm sm:text-base">現在の条件に一致するライダーがありません</p>
            <p class="text-gray-500 text-xs mt-1">上のチェックボックスや作品・分類フィルターを変更してください</p>
        </div>
    </main>

    <!-- ==================== フッター ==================== -->
    <footer class="border-t border-gray-800/80 bg-gray-950/80 py-4 mt-8 text-center text-xs text-gray-500">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
            <div>
                <span class="font-bold text-gray-400">仮面ライダー言えるかな？</span>
            </div>
        </div>
    </footer>

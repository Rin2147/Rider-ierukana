        // ==================== アプリケーション状態管理 ====================
        let riders = [];                  // 読み込まれた全ライダーリスト
        let gameStatus = 'IDLE';          // 'IDLE' | 'PLAYING' | 'CLEARED' | 'GAVE_UP'
        let startTime = 0;                // タイマー開始時刻
        let elapsedTime = 0;              // 経過時間(ms)
        let timerInterval = null;         // setInterval ID
        let currentEraFilter = 'ALL';     // 'ALL' | '昭和' | '平成1期' | '平成2期' | '令和' ...
        let currentWorkFilter = 'ALL';    // 'ALL' | 各初登場作品名（C列）
        let currentStatusFilter = 'ALL';  // 'ALL' | 'UNANSWERED' | 'ANSWERED'
        let currentGridSize = 'md';       // 'sm' | 'md' | 'lg'
        let showHints = false;            // ヒント表示ON/OFF
        let soundEnabled = true;          // 効果音ON/OFF
        let audioCtx = null;              // Web Audio API コンテキスト

        // チェックボックスの状態
        let filterSeriesSort = false;
        let filterVisualOnly = true;
        let filterNovelOnly = false;
        let filterStageOnly = false;
        let filterGameOnly = false;

        // ==================== 効果音シンセサイザー (外部音源不要) ====================
        function playSound(type) {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const now = audioCtx.currentTime;
                if (type === 'start') {
                    const freqs = [440, 554.37, 659.25, 880];
                    freqs.forEach((f, idx) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(f, now + idx * 0.06);
                        gain.gain.setValueAtTime(0.08, now + idx * 0.06);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.18);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + idx * 0.06);
                        osc.stop(now + idx * 0.06 + 0.19);
                    });
                } else if (type === 'hit') {
                    const freqs = [587.33, 880];
                    freqs.forEach((f, idx) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(f, now + idx * 0.07);
                        gain.gain.setValueAtTime(0.14, now + idx * 0.07);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.22);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + idx * 0.07);
                        osc.stop(now + idx * 0.07 + 0.23);
                    });
                } else if (type === 'already') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(350, now);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.16);
                } else if (type === 'miss') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(160, now);
                    osc.frequency.setValueAtTime(130, now + 0.08);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.22);
                } else if (type === 'clear') {
                    const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50];
                    const times = [0, 0.1, 0.2, 0.3, 0.45, 0.58];
                    const durations = [0.09, 0.09, 0.09, 0.14, 0.12, 0.45];
                    notes.forEach((f, i) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(f, now + times[i]);
                        gain.gain.setValueAtTime(0.15, now + times[i]);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + times[i] + durations[i]);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + times[i]);
                        osc.stop(now + times[i] + durations[i] + 0.02);
                    });
                }
            } catch (e) {
                // Audioエラーは無視
            }
        }

        // ==================== 文字列正規化（表記ゆれ吸収） ====================
        function normalizeString(str) {
            if (!str) return '';
            let s = String(str).trim();
            // 全角英数記号を半角へ
            s = s.replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(ch) {
                return String.fromCharCode(ch.charCodeAt(0) - 0xFEE0);
            });
            s = s.toUpperCase();
            // ひらがなをカタカナへ変換
            s = s.replace(/[\u3041-\u3096]/g, function(ch) {
                return String.fromCharCode(ch.charCodeAt(0) + 0x60);
            });
            // 記号・空白除去
            s = s.replace(/[\s　・･\-ー_〜~＝=：:（）()「」『』【】]/g, '');
            return s;
        }

        /**
         * 1人のライダーデータ（名前・ルビ）から正解判定用のキーワード配列を生成
         */
        function buildAcceptedKeywords(rider) {
            const rawCandidates = [rider.name, rider.ruby];
            const keywordSet = new Set();

            rawCandidates.forEach(raw => {
                if (!raw) return;
                const parts = String(raw).split(/[|｜\/,、]+/);
                parts.forEach(part => {
                    const cleaned = part.trim();
                    if (!cleaned) return;

                    const normFull = normalizeString(cleaned);
                    if (normFull) keywordSet.add(normFull);

                    // 「仮面ライダー」「かめんらいだー」「カメンライダー」を先頭から除いた短縮形も登録
                    const withoutPrefix = cleaned
                        .replace(/^(真・?|シン・?|新・?)?(仮面ライダー|かめんらいだー|カメンライダー)/i, '')
                        .trim();
                    if (withoutPrefix) {
                        const normShort = normalizeString(withoutPrefix);
                        if (normShort) keywordSet.add(normShort);
                    }

                    // 「ガヴ」⇔「ガブ」などのヴ表記ゆれも追加登録
                    if (normFull.includes('ヴ')) {
                        keywordSet.add(normFull.replace(/ヴ/g, 'ブ'));
                    }
                    if (withoutPrefix) {
                        const normShort = normalizeString(withoutPrefix);
                        if (normShort.includes('ヴ')) {
                            keywordSet.add(normShort.replace(/ヴ/g, 'ブ'));
                        }
                    }
                });
            });

            return Array.from(keywordSet);
        }

        // ==================== タグ分類判定ヘルパー ====================
        function getRiderTagInfo(tagStr) {
            const t = String(tagStr || '').trim();
            const isNovel = t.includes('小説');
            const isStage = t.includes('舞台');
            const isMovie = t.includes('映画');
            const isGame = t.includes('ゲーム');
            const isVisual = !isNovel && !isStage && !isGame;

            // 常時表示するタグ（小説・舞台・ゲームのみ。父親や女性ライダー等は除外）
            const alwaysTags = [];
            if (isNovel) alwaysTags.push('小説');
            if (isStage) alwaysTags.push('舞台');
            if (isGame) alwaysTags.push('ゲーム');

            return { isNovel, isStage, isMovie, isGame, isVisual, alwaysTags };
        }

        /**
         * タグ（映像化作品 / 小説 / 舞台 / ゲーム）のチェック状態に合致するかを判定するヘルパー
         */
        function matchesTagFilter(rider) {
            const { isNovel, isStage, isGame, isVisual } = rider.tagInfo;
            const anyChecked = filterVisualOnly || filterNovelOnly || filterStageOnly || filterGameOnly;
            if (!anyChecked) return true;
            return (
                (filterVisualOnly && isVisual) ||
                (filterNovelOnly && isNovel) ||
                (filterStageOnly && isStage) ||
                (filterGameOnly && isGame)
            );
        }

        /**
         * 現在のチェックボックス＆分類タブ＆作品フィルタ設定に基づいて「出題対象となるライダー一覧」を返す
         */
        function getActiveQuizRiders() {
            return riders.filter(r => {
                // 1. E列（昭和・平成1期・平成2期・令和など）フィルター
                if (currentEraFilter !== 'ALL' && r.era !== currentEraFilter) {
                    return false;
                }

                // 2. C列（初登場作品）フィルター
                if (currentWorkFilter !== 'ALL' && r.work !== currentWorkFilter) {
                    return false;
                }

                // 3. F列（映像化作品 / 小説 / 舞台 / ゲーム）チェックボックス判定
                return matchesTagFilter(r);
            });
        }

        /**
         * クリア時のシェア文言に入る「出題範囲」の文字列を生成
         */
        function getQuizRangeLabel(activePoolCount) {
            const allTagsSelectedOrNone =
                (filterVisualOnly && filterNovelOnly && filterStageOnly && filterGameOnly) ||
                (!filterVisualOnly && !filterNovelOnly && !filterStageOnly && !filterGameOnly);

            // 全ライダーが出題対象になっている場合は「全ライダー」
            if (
                riders.length > 0 &&
                (activePoolCount === riders.length ||
                    (currentEraFilter === 'ALL' && currentWorkFilter === 'ALL' && allTagsSelectedOrNone))
            ) {
                return '全ライダー';
            }

            const parts = [];

            // 作品フィルタが指定されている場合は作品名を優先表示
            if (currentWorkFilter !== 'ALL') {
                parts.push(currentWorkFilter);
            } else if (currentEraFilter !== 'ALL') {
                parts.push(currentEraFilter);
            }

            // タグ条件の表記
            if (!allTagsSelectedOrNone) {
                if (filterVisualOnly && !filterNovelOnly && !filterStageOnly && !filterGameOnly) {
                    if (currentWorkFilter === 'ALL') {
                        parts.push('映像化作品のみ');
                    }
                } else {
                    const tagParts = [];
                    if (filterVisualOnly) tagParts.push('映像化作品');
                    if (filterNovelOnly) tagParts.push('小説限定');
                    if (filterStageOnly) tagParts.push('舞台限定');
                    if (filterGameOnly) tagParts.push('ゲーム限定');
                    if (tagParts.length > 0) {
                        parts.push(tagParts.join('・'));
                    }
                }
            }

            return parts.length > 0 ? parts.join(' / ') : '全ライダー';
        }

        // ==================== CSVパーサー（2行目からデータ開始・6列仕様） ====================
        function parseCSVText(csvText) {
            const lines = csvText
                .replace(/^\uFEFF/, '') // BOM除去
                .split(/\r?\n/)
                .filter(l => l.trim().length > 0);

            if (lines.length === 0) return [];

            const parseRow = (rowStr) => {
                const result = [];
                let cur = '';
                let inQuotes = false;
                for (let i = 0; i < rowStr.length; i++) {
                    const ch = rowStr[i];
                    if (ch === '"') {
                        if (inQuotes && rowStr[i + 1] === '"') {
                            cur += '"';
                            i++;
                        } else {
                            inQuotes = !inQuotes;
                        }
                    } else if (ch === ',' && !inQuotes) {
                        result.push(cur.trim());
                        cur = '';
                    } else {
                        cur += ch;
                    }
                }
                result.push(cur.trim());
                return result;
            };

            const rows = lines.map(parseRow);
            const dataRows = rows.length >= 2 ? rows.slice(1) : rows;
            const parsedRiders = [];

            dataRows.forEach((cols) => {
                if (!cols || cols.length === 0) return;
                const name = (cols[0] || '').trim();
                if (!name) return;

                const ruby = (cols[1] || '').trim();
                const work = (cols[2] || '').trim() || '作品未設定';
                const image = (cols[3] || '').trim();
                const era = (cols[4] || '').trim() || '未分類';
                const tag = (cols[5] || '').trim();

                parsedRiders.push({
                    name,
                    ruby,
                    work,
                    image,
                    era,
                    tag
                });
            });

            return parsedRiders;
        }

        // ==================== ライダーデータの初期化・セット ====================
        function initializeRidersData(rawList) {
            riders = rawList.map((r, index) => {
                const riderObj = {
                    index: index,
                    id: String(index + 1).padStart(3, '0'),
                    name: r.name,
                    ruby: r.ruby || '',
                    work: r.work || '作品未設定',
                    image: r.image || '',
                    era: r.era || '未分類',
                    tag: r.tag || '',
                    tagInfo: getRiderTagInfo(r.tag),
                    answered: false,
                    gaveUp: false
                };
                riderObj.keywords = buildAcceptedKeywords(riderObj);
                return riderObj;
            });

            // 現在の分類フィルタが存在しない値になっていたらALLに戻す
            const availableEras = new Set(riders.map(r => r.era));
            if (currentEraFilter !== 'ALL' && !availableEras.has(currentEraFilter)) {
                currentEraFilter = 'ALL';
            }

            buildEraTabs();
            buildWorkFilterOptions();
            updateCheckboxCounts();
            resetGame();
        }

        // ==================== C列（初登場作品）プルダウンの動的生成 ====================
        function buildWorkFilterOptions() {
            const selectEl = document.getElementById('workFilterSelect');
            if (!selectEl) return;

            // 現在の年代（E列）およびタグ条件に一致するライダーから作品一覧を集計
            const baseRiders = riders.filter(r => {
                if (currentEraFilter !== 'ALL' && r.era !== currentEraFilter) return false;
                return matchesTagFilter(r);
            });

            const workCounts = new Map();
            baseRiders.forEach(r => {
                const w = r.work || '作品未設定';
                workCounts.set(w, (workCounts.get(w) || 0) + 1);
            });

            // 現在選択中の作品が絞り込み後のリストに存在しない場合はALLにリセット
            if (currentWorkFilter !== 'ALL' && !workCounts.has(currentWorkFilter)) {
                currentWorkFilter = 'ALL';
            }

            selectEl.innerHTML = '';

            const allOption = document.createElement('option');
            allOption.value = 'ALL';
            allOption.textContent = `すべての作品 (${baseRiders.length}人)`;
            selectEl.appendChild(allOption);

            workCounts.forEach((count, workTitle) => {
                const opt = document.createElement('option');
                opt.value = workTitle;
                opt.textContent = `${workTitle} (${count}人)`;
                selectEl.appendChild(opt);
            });

            selectEl.value = currentWorkFilter;
        }

        // ==================== E列（分類）タブの動的生成 ====================
        function buildEraTabs() {
            const container = document.getElementById('eraFilterContainer');
            container.innerHTML = '';

            // 定番順序を維持しつつCSV内のユニークなE列を追加
            const standardOrder = ['昭和', '平成1期', '平成2期', '令和'];
            const csvEras = Array.from(new Set(riders.map(r => r.era).filter(Boolean)));
            const orderedEras = [
                ...standardOrder.filter(e => csvEras.includes(e)),
                ...csvEras.filter(e => !standardOrder.includes(e))
            ];

            const allTabs = ['ALL', ...orderedEras];

            allTabs.forEach(eraKey => {
                const btn = document.createElement('button');
                btn.setAttribute('data-era', eraKey);
                const label = eraKey === 'ALL' ? 'すべて' : eraKey;
                const isActive = currentEraFilter === eraKey;

                btn.className = isActive
                    ? 'era-tab active-tab px-3 py-1.5 rounded-lg text-xs font-black transition bg-rider-red text-white shadow shadow-red-900/40'
                    : 'era-tab px-3 py-1.5 rounded-lg text-xs font-bold transition bg-gray-900 hover:bg-gray-800 text-gray-300 border border-gray-800';

                btn.innerHTML = `${label} <span class="ml-1 px-1.5 py-0.2 bg-black/30 rounded font-mono text-[10px]" id="badge-era-${eraKey}">0/0</span>`;

                btn.addEventListener('click', () => {
                    if (gameStatus === 'PLAYING') {
                        showFeedback('プレイ中は出題分類（昭和/平成/令和）を変更できません。リセット後に変更してください。', 'warn');
                        return;
                    }
                    currentEraFilter = eraKey;
                    buildEraTabs();
                    buildWorkFilterOptions();
                    updateCheckboxCounts();
                    renderGrid();
                });

                container.appendChild(btn);
            });
        }

        // ==================== チェックボックス横の人数バッジ更新 ====================
        function updateCheckboxCounts() {
            const eraAndWorkFiltered = riders.filter(r => {
                if (currentEraFilter !== 'ALL' && r.era !== currentEraFilter) return false;
                if (currentWorkFilter !== 'ALL' && r.work !== currentWorkFilter) return false;
                return true;
            });
            const visualCount = eraAndWorkFiltered.filter(r => r.tagInfo.isVisual).length;
            const novelCount = eraAndWorkFiltered.filter(r => r.tagInfo.isNovel).length;
            const stageCount = eraAndWorkFiltered.filter(r => r.tagInfo.isStage).length;
            const gameCount = eraAndWorkFiltered.filter(r => r.tagInfo.isGame).length;

            document.getElementById('countVisualOnly').textContent = visualCount;
            document.getElementById('countNovelOnly').textContent = novelCount;
            document.getElementById('countStageOnly').textContent = stageCount;
            document.getElementById('countGameOnly').textContent = gameCount;
        }

        // ==================== 同階層の ./rider.csv 自動読込 ====================
        async function loadInitialCsvData() {
            const candidateFiles = ['./rider.csv', './riders.csv', './Rider.csv', './Riders.csv'];

            for (const filePath of candidateFiles) {
                try {
                    const response = await fetch(filePath, { cache: 'no-cache' });
                    if (response.ok) {
                        const buffer = await response.arrayBuffer();
                        const text = decodeArrayBufferAuto(buffer);
                        const parsed = parseCSVText(text);
                        if (parsed.length > 0) {
                            initializeRidersData(parsed);
                            return;
                        }
                    }
                } catch (err) {
                    // fetch失敗時は次の候補またはフォールバックデータへ
                }
            }

            initializeRidersData(DEFAULT_RIDERS_DATA);
        }

        function decodeArrayBufferAuto(buffer) {
            try {
                const utf8Decoder = new TextDecoder('utf-8', { fatal: true });
                return utf8Decoder.decode(buffer);
            } catch (e) {
                const sjisDecoder = new TextDecoder('shift-jis');
                return sjisDecoder.decode(buffer);
            }
        }

        // ==================== カードHTML生成 ====================
        function createRiderCardElement(rider) {
            const card = document.createElement('div');
            card.id = `rider-card-${rider.index}`;

            const isOpened = rider.answered || rider.gaveUp;

            // タグバッジ表示制御：
            // 小説・舞台・ゲームは常時表示、「映画」はヒントON時のみ表示、その他のタグ（父親・女性ライダーなど）は非表示
            const visibleTags = [...rider.tagInfo.alwaysTags];
            if (showHints && rider.tagInfo.isMovie) {
                visibleTags.push('映画');
            }

            let tagBadgeHtml = '';
            if (visibleTags.length > 0) {
                tagBadgeHtml = visibleTags.map(t => {
                    let tagColorClass = 'bg-amber-950/90 text-amber-300 border-amber-600/50';
                    if (t === '舞台') tagColorClass = 'bg-purple-950/90 text-purple-300 border-purple-600/50';
                    if (t === '映画') tagColorClass = 'bg-sky-950/90 text-sky-300 border-sky-600/50';
                    if (t === 'ゲーム') tagColorClass = 'bg-pink-950/90 text-pink-300 border-pink-600/50';
                    return `<span class="px-1.5 py-0.5 rounded text-[9px] sm:text-[10px] font-bold border ${tagColorClass}">${escapeHtml(t)}</span>`;
                }).join('');
            }

            if (isOpened) {
                // オープン状態（正解済み or ギブアップ開示）
                const borderClass = rider.answered 
                    ? 'border-amber-500/80 bg-gray-900 shadow-lg shadow-amber-950/20' 
                    : 'border-red-600/75 bg-gray-950 opacity-90';

                const frameBgClass = rider.answered
                    ? 'rider-name-frame'
                    : 'rider-name-frame-giveup';

                const statusBadgeHtml = rider.answered
                    ? `<span class="px-1.5 py-0.5 text-[9px] sm:text-[10px] font-mono font-black rounded bg-amber-500 text-gray-950 shadow">OPEN</span>`
                    : `<span class="px-1.5 py-0.5 text-[9px] sm:text-[10px] font-bold rounded bg-red-600 text-white shadow">未回答</span>`;

                const nameLen = rider.name.length;
                let nameFontSize = 'text-sm sm:text-lg';
                if (nameLen >= 16) {
                    nameFontSize = 'text-[11px] sm:text-sm';
                } else if (nameLen >= 11) {
                    nameFontSize = 'text-xs sm:text-base';
                }

                card.className = `group relative rounded-xl border-2 ${borderClass} overflow-hidden flex flex-col transition-all duration-300`;
                card.innerHTML = `
                    <!-- 画像枠風エリア：中央に「名前」だけを表示 -->
                    <div class="relative aspect-[4/3] w-full ${frameBgClass} p-2.5 sm:p-3 flex flex-col items-center justify-center text-center overflow-hidden select-none">
                        <!-- 上部：番号＆ステータスバッジ -->
                        <div class="absolute top-1.5 left-1.5 right-1.5 flex items-center justify-between gap-1 pointer-events-none">
                            <span class="px-1.5 py-0.5 rounded bg-black/70 text-[9px] sm:text-[10px] font-mono font-bold text-gray-300 border border-white/10">
                                No.${rider.id}
                            </span>
                            <div class="flex items-center gap-1">
                                ${tagBadgeHtml}
                                ${statusBadgeHtml}
                            </div>
                        </div>

                        <!-- 中央：ライダー名のみ表示 -->
                        <div class="${nameFontSize} font-black text-white leading-snug tracking-tight drop-shadow-[0_2px_10px_rgba(0,0,0,0.9)] px-1 break-words max-w-full">
                            ${escapeHtml(rider.name)}
                        </div>

                        <!-- 下部：分類（昭和/平成/令和） -->
                        <div class="absolute bottom-1.5 right-2 text-[9px] sm:text-[10px] font-bold text-gray-400 bg-black/60 px-1.5 py-0.2 rounded border border-white/5">
                            ${escapeHtml(rider.era)}
                        </div>
                    </div>

                    <!-- カード下部フッター：ルビ（B列）＆初登場作品（C列） -->
                    <div class="px-2 py-1.5 sm:px-2.5 sm:py-2 bg-gray-950 border-t border-gray-800/90 flex flex-col justify-center gap-0.5 text-center">
                        <div class="text-[9px] sm:text-[10px] text-amber-400/90 font-medium truncate" title="${escapeHtml(rider.ruby)}">
                            ${escapeHtml(rider.ruby || '―')}
                        </div>
                        <div class="text-[10px] sm:text-[11px] text-gray-400 font-bold truncate" title="初登場: ${escapeHtml(rider.work)}">
                            <i class="fa-solid fa-tv text-[9px] text-gray-500 mr-1"></i>${escapeHtml(rider.work)}
                        </div>
                    </div>
                `;
            } else {
                // ロック（未回答）状態
                const rubyClean = (rider.ruby || rider.name).replace(/^(かめんらいだー|仮面ライダー|カメンライダー)/i, '');
                const firstChar = rubyClean.charAt(0) || '?';

                // ヒントON時は2段構成にして文字サイズを最適化し、長い作品名も見切れにくくする
                const lockCircleHtml = showHints
                    ? `<div class="w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-gray-950 border border-gray-800 flex items-center justify-center shadow-inner shrink-0 mt-3">
                           <span class="font-mono text-[11px] sm:text-xs font-black text-gray-600">???</span>
                       </div>`
                    : `<div class="w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-gray-950 border border-gray-800 flex items-center justify-center shadow-inner">
                           <span class="font-mono text-sm sm:text-base font-black text-gray-600">???</span>
                       </div>`;

                const hintBoxHtml = showHints
                    ? `<div class="mt-1 w-full px-1.5 py-1 rounded-lg bg-amber-950/75 border border-amber-600/40 text-center flex flex-col items-center justify-center gap-0.5 overflow-hidden" title="頭文字「${escapeHtml(firstChar)}」 / 初登場: ${escapeHtml(rider.work)}">
                         <div class="text-[10px] sm:text-[11px] font-black text-amber-300 leading-none">
                             頭文字「${escapeHtml(firstChar)}」
                         </div>
                         <div class="text-[9px] sm:text-[10px] text-amber-100/90 font-bold leading-tight line-clamp-2 break-words w-full">
                             ${escapeHtml(rider.work)}
                         </div>
                       </div>`
                    : `<div class="text-[11px] text-gray-500 font-bold mt-1">${escapeHtml(rider.era)}</div>`;

                card.className = `relative rounded-xl border border-gray-800 bg-gray-900/60 hover:border-gray-700 overflow-hidden flex flex-col transition`;
                card.innerHTML = `
                    <div class="relative aspect-[4/3] w-full flex flex-col items-center justify-center p-2 hero-stripes overflow-hidden">
                        <div class="absolute top-1.5 left-1.5 right-1.5 flex items-center justify-between gap-1">
                            <span class="px-1.5 py-0.5 rounded bg-gray-950/90 text-[10px] font-mono font-bold text-gray-500 border border-gray-800">
                                No.${rider.id}
                            </span>
                            <div class="flex items-center gap-1">
                                ${tagBadgeHtml}
                            </div>
                        </div>
                        ${lockCircleHtml}
                        ${hintBoxHtml}
                    </div>
                    <div class="px-2 py-1.5 text-center bg-gray-950/90 border-t border-gray-800/80">
                        <div class="text-[11px] font-mono font-bold text-gray-600 tracking-widest">LOCKED</div>
                    </div>
                `;
            }

            return card;
        }

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // ==================== グリッド＆シリーズソート描画 ====================
        function getGridClassName() {
            if (currentGridSize === 'sm') {
                return 'grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-1.5 sm:gap-2';
            } else if (currentGridSize === 'lg') {
                return 'grid grid-cols-1 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3';
            } else {
                return 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 lg:grid-cols-6 gap-2 sm:gap-3';
            }
        }

        function renderGrid() {
            const mainContainer = document.getElementById('riderMainContainer');
            const emptyMsg = document.getElementById('emptyStateMessage');
            mainContainer.innerHTML = '';

            const activePool = getActiveQuizRiders();

            const displayRiders = activePool.filter(r => {
                if (currentStatusFilter === 'ANSWERED') return r.answered;
                if (currentStatusFilter === 'UNANSWERED') return !r.answered;
                return true;
            });

            if (displayRiders.length === 0) {
                emptyMsg.classList.remove('hidden');
            } else {
                emptyMsg.classList.add('hidden');
            }

            if (filterSeriesSort) {
                // 【シリーズソートON】：初登場作品ごとにグループ化して並べる
                const workGroups = new Map();
                displayRiders.forEach(r => {
                    const workTitle = r.work || '作品未設定';
                    if (!workGroups.has(workTitle)) {
                        workGroups.set(workTitle, []);
                    }
                    workGroups.get(workTitle).push(r);
                });

                workGroups.forEach((groupRiders, workTitle) => {
                    const section = document.createElement('div');
                    section.className = 'space-y-2.5 bg-gray-900/35 p-3 sm:p-4 rounded-2xl border border-gray-800/80';

                    const allInWork = activePool.filter(r => (r.work || '作品未設定') === workTitle);
                    const answeredInWork = allInWork.filter(r => r.answered).length;
                    const eraLabel = groupRiders[0]?.era || '';

                    const header = document.createElement('div');
                    header.className = 'flex flex-wrap items-center justify-between gap-2 border-b border-gray-800 pb-2';
                    header.innerHTML = `
                        <div class="flex items-center gap-2 min-w-0">
                            <span class="w-1.5 h-5 rounded-full bg-rider-red shrink-0"></span>
                            <h2 class="text-sm sm:text-base font-black text-white tracking-tight truncate">${escapeHtml(workTitle)}</h2>
                            <span class="px-2 py-0.5 rounded bg-gray-800 text-gray-300 text-[10px] font-bold shrink-0">${escapeHtml(eraLabel)}</span>
                        </div>
                        <div class="text-xs font-mono font-bold ${answeredInWork === allInWork.length ? 'text-amber-400' : 'text-gray-400'} shrink-0">
                            ${answeredInWork} / ${allInWork.length} 解放
                        </div>
                    `;

                    const grid = document.createElement('div');
                    grid.className = getGridClassName();

                    groupRiders.forEach(rider => {
                        grid.appendChild(createRiderCardElement(rider));
                    });

                    section.appendChild(header);
                    section.appendChild(grid);
                    mainContainer.appendChild(section);
                });
            } else {
                // 【シリーズソートOFF】：フラットなグリッド表示
                const grid = document.createElement('div');
                grid.className = getGridClassName();
                displayRiders.forEach(rider => {
                    grid.appendChild(createRiderCardElement(rider));
                });
                mainContainer.appendChild(grid);
            }

            updateStatsAndBadges();
        }

        // ==================== 進捗バーと各年代バッジの更新 ====================
        function updateStatsAndBadges() {
            const activePool = getActiveQuizRiders();
            const totalActive = activePool.length;
            const answeredActive = activePool.filter(r => r.answered).length;

            document.getElementById('correctCount').textContent = answeredActive;
            document.getElementById('totalCount').textContent = totalActive;
            document.getElementById('activePoolCountText').textContent = totalActive;

            const pct = totalActive > 0 ? Math.round((answeredActive / totalActive) * 100) : 0;
            document.getElementById('progressBar').style.width = `${pct}%`;

            // 各分類タブのバッジ更新（現在のタグ条件＆作品条件における各分類の人数を表示）
            const eraButtons = document.querySelectorAll('#eraFilterContainer [data-era]');
            eraButtons.forEach(btn => {
                const eraKey = btn.getAttribute('data-era');
                const badgeEl = document.getElementById(`badge-era-${eraKey}`);
                if (!badgeEl) return;

                const matchingRiders = riders.filter(r => {
                    if (eraKey !== 'ALL' && r.era !== eraKey) return false;
                    if (currentWorkFilter !== 'ALL' && r.work !== currentWorkFilter) return false;
                    return matchesTagFilter(r);
                });

                const doneCount = matchingRiders.filter(r => r.answered).length;
                badgeEl.textContent = `${doneCount}/${matchingRiders.length}`;
            });
        }

        // ==================== タイマー処理 ====================
        function formatTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
            const seconds = String(totalSeconds % 60).padStart(2, '0');
            const centiseconds = String(Math.floor((ms % 1000) / 10)).padStart(2, '0');
            return { minutes, seconds, centiseconds, fullText: `${minutes}:${seconds}.${centiseconds}` };
        }

        function updateTimerDisplay() {
            const t = formatTime(elapsedTime);
            const timerEl = document.getElementById('timerDisplay');
            timerEl.innerHTML = `${t.minutes}:${t.seconds}.<span class="text-sm sm:text-lg text-amber-400">${t.centiseconds}</span>`;
        }

        function startTimer() {
            startTime = performance.now() - elapsedTime;
            const indicator = document.getElementById('timerIndicator');
            indicator.className = 'w-2.5 h-2.5 sm:w-3 sm:h-3 rounded-full bg-rider-red animate-ping shrink-0';

            timerInterval = setInterval(() => {
                elapsedTime = performance.now() - startTime;
                updateTimerDisplay();
            }, 31);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            const indicator = document.getElementById('timerIndicator');
            indicator.className = 'w-2.5 h-2.5 sm:w-3 sm:h-3 rounded-full bg-amber-400 shrink-0';
        }

        // ==================== 出題範囲チェックボックスのロック切替 ====================
        function setFilterCheckboxesDisabled(disabled) {
            document.getElementById('chkVisualOnly').disabled = disabled;
            document.getElementById('chkNovelOnly').disabled = disabled;
            document.getElementById('chkStageOnly').disabled = disabled;
            document.getElementById('chkGameOnly').disabled = disabled;
            const workSelect = document.getElementById('workFilterSelect');
            if (workSelect) workSelect.disabled = disabled;

            const notice = document.getElementById('filterLockNotice');
            if (disabled) {
                notice.classList.remove('hidden');
            } else {
                notice.classList.add('hidden');
            }
        }

        // ==================== ゲーム開始・ギブアップ・リセット ====================
        function startGame() {
            if (gameStatus === 'PLAYING') return;

            if (gameStatus === 'CLEARED' || gameStatus === 'GAVE_UP') {
                resetGame();
            }

            const activePool = getActiveQuizRiders();
            if (activePool.length === 0) {
                showFeedback('出題対象のライダーが0人です。チェックボックスや作品フィルターを変更してください！', 'error');
                return;
            }

            gameStatus = 'PLAYING';
            playSound('start');
            setFilterCheckboxesDisabled(true);

            const input = document.getElementById('riderInput');
            const submitBtn = document.getElementById('submitAnswerBtn');
            const startBtn = document.getElementById('startBtn');
            const giveUpBtn = document.getElementById('giveUpBtn');

            input.disabled = false;
            submitBtn.disabled = false;
            giveUpBtn.disabled = false;

            startBtn.innerHTML = `<i class="fa-solid fa-fire text-amber-300"></i><span>挑戦中...</span>`;
            startBtn.classList.add('opacity-60', 'pointer-events-none');

            showFeedback(`スタート！ 対象 ${activePool.length}人のライダー名を入力しよう！`, 'info');
            startTimer();
            input.focus();
        }

        function giveUpGame() {
            if (gameStatus !== 'PLAYING') return;
            stopTimer();
            gameStatus = 'GAVE_UP';
            playSound('miss');
            setFilterCheckboxesDisabled(false);

            const activePool = getActiveQuizRiders();
            activePool.forEach(r => {
                if (!r.answered) {
                    r.gaveUp = true;
                }
            });

            const input = document.getElementById('riderInput');
            const submitBtn = document.getElementById('submitAnswerBtn');
            const startBtn = document.getElementById('startBtn');
            const giveUpBtn = document.getElementById('giveUpBtn');

            input.disabled = true;
            submitBtn.disabled = true;
            giveUpBtn.disabled = true;

            startBtn.innerHTML = `<i class="fa-solid fa-play"></i><span>再スタート</span>`;
            startBtn.classList.remove('opacity-60', 'pointer-events-none');

            const answeredCount = activePool.filter(r => r.answered).length;
            showFeedback(`ギブアップ！ 記録：${answeredCount} / ${activePool.length}人`, 'warn');
            renderGrid();
        }

        function resetGame() {
            stopTimer();
            gameStatus = 'IDLE';
            elapsedTime = 0;
            updateTimerDisplay();
            setFilterCheckboxesDisabled(false);

            const indicator = document.getElementById('timerIndicator');
            indicator.className = 'w-2.5 h-2.5 sm:w-3 sm:h-3 rounded-full bg-gray-600 shrink-0';

            riders.forEach(r => {
                r.answered = false;
                r.gaveUp = false;
            });

            const input = document.getElementById('riderInput');
            const submitBtn = document.getElementById('submitAnswerBtn');
            const startBtn = document.getElementById('startBtn');
            const giveUpBtn = document.getElementById('giveUpBtn');

            input.value = '';
            input.disabled = true;
            submitBtn.disabled = true;
            giveUpBtn.disabled = true;

            startBtn.innerHTML = `<i class="fa-solid fa-play"></i><span>スタート！</span>`;
            startBtn.classList.remove('opacity-60', 'pointer-events-none');

            document.getElementById('recentHitBanner').classList.add('hidden');
            showFeedback('「仮面ライダー」は省略して入力できます', 'default');

            renderGrid();
        }

        // ==================== 回答チェック・正誤判定 ====================
        function checkAnswer(rawInput, isEnterPressed = false) {
            if (gameStatus !== 'PLAYING') return;

            const normalizedInput = normalizeString(rawInput);
            if (!normalizedInput) return;

            const strippedInput = normalizeString(
                rawInput.replace(/^(真・?|シン・?|新・?)?(仮面ライダー|かめんらいだー|カメンライダー)/i, '')
            );

            const activePool = getActiveQuizRiders();

            // 1. 現在の出題対象（activePool）の中で、未回答かつ一致するライダーを探す
            const unansweredMatches = activePool.filter(r => {
                if (r.answered) return false;
                return r.keywords.includes(normalizedInput) || (strippedInput && r.keywords.includes(strippedInput));
            });

            if (unansweredMatches.length > 0) {
                unlockRiders(unansweredMatches);
                document.getElementById('riderInput').value = '';
                return;
            }

            // 2. すでに入力済みのライダーに一致するか探す
            const alreadyMatches = activePool.filter(r => {
                if (!r.answered) return false;
                return r.keywords.includes(normalizedInput) || (strippedInput && r.keywords.includes(strippedInput));
            });

            if (alreadyMatches.length > 0) {
                const isPrefixOfUnanswered = activePool.some(r => {
                    if (r.answered) return false;
                    return r.keywords.some(k => k.startsWith(normalizedInput) || (strippedInput && k.startsWith(strippedInput)));
                });

                if (isEnterPressed || !isPrefixOfUnanswered) {
                    const matched = alreadyMatches[0];
                    playSound('already');
                    showFeedback(`「${matched.name}」はすでに入力済みです！`, 'warn');
                    highlightCard(matched.index, 'animate-already');
                    if (isEnterPressed) {
                        document.getElementById('riderInput').value = '';
                    }
                }
                return;
            }

            // 3. Enterキー押下時でどれにもヒットしなかった場合
            if (isEnterPressed) {
                playSound('miss');
                showFeedback(`「${rawInput}」に一致するライダーが見つかりません`, 'error');
                const inputEl = document.getElementById('riderInput');
                inputEl.classList.remove('animate-shake');
                void inputEl.offsetWidth;
                inputEl.classList.add('animate-shake');
            }
        }

        // ==================== ライダー解放＆全クリ判定 ====================
        function unlockRiders(matchedRiders) {
            matchedRiders.forEach(r => {
                r.answered = true;
            });
            playSound('hit');

            const activePool = getActiveQuizRiders();
            const remainingCount = activePool.filter(r => !r.answered).length;
            const firstRider = matchedRiders[0];

            const namesStr = matchedRiders.map(r => r.name).join(' / ');
            showFeedback(`正解！「${namesStr}」をオープン！`, 'success');

            const banner = document.getElementById('recentHitBanner');
            const hitText = document.getElementById('recentHitText');
            const hitSub = document.getElementById('recentHitSub');
            banner.classList.remove('hidden');
            hitText.textContent = `No.${firstRider.id} ${namesStr}（${firstRider.work}）`;
            hitSub.textContent = `${firstRider.era} / 残り ${remainingCount}人`;

            renderGrid();

            matchedRiders.forEach(r => {
                highlightCard(r.index, 'animate-unlock');
            });

            if (document.getElementById('autoScrollToggle').checked) {
                const cardEl = document.getElementById(`rider-card-${firstRider.index}`);
                if (cardEl) {
                    cardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }

            if (remainingCount === 0) {
                handleGameClear(activePool.length);
            }
        }

        function highlightCard(riderIndex, animClass) {
            const cardEl = document.getElementById(`rider-card-${riderIndex}`);
            if (!cardEl) return;
            cardEl.classList.remove('animate-unlock', 'animate-already');
            void cardEl.offsetWidth;
            cardEl.classList.add(animClass);
        }

        function handleGameClear(totalCleared) {
            stopTimer();
            gameStatus = 'CLEARED';
            playSound('clear');
            setFilterCheckboxesDisabled(false);

            const input = document.getElementById('riderInput');
            const submitBtn = document.getElementById('submitAnswerBtn');
            const startBtn = document.getElementById('startBtn');
            const giveUpBtn = document.getElementById('giveUpBtn');

            input.disabled = true;
            submitBtn.disabled = true;
            giveUpBtn.disabled = true;

            startBtn.innerHTML = `<i class="fa-solid fa-trophy text-amber-300"></i><span>COMPLETE!</span>`;
            startBtn.classList.remove('opacity-60', 'pointer-events-none');

            const timeObj = formatTime(elapsedTime);
            document.getElementById('modalClearTime').textContent = timeObj.fullText;
            document.getElementById('modalClearCount').textContent = `${totalCleared} / ${totalCleared}`;

            const modal = document.getElementById('clearModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        // ==================== フィードバック表示ヘルパー ====================
        function showFeedback(msg, type = 'default') {
            const el = document.getElementById('feedbackMessage');
            if (type === 'success') {
                el.className = 'text-[11px] sm:text-xs font-bold text-emerald-400 truncate max-w-full sm:max-w-[62%] min-h-[16px] flex items-center gap-1';
                el.innerHTML = `<i class="fa-solid fa-circle-check"></i><span>${escapeHtml(msg)}</span>`;
            } else if (type === 'warn') {
                el.className = 'text-[11px] sm:text-xs font-bold text-amber-400 truncate max-w-full sm:max-w-[62%] min-h-[16px] flex items-center gap-1';
                el.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i><span>${escapeHtml(msg)}</span>`;
            } else if (type === 'error') {
                el.className = 'text-[11px] sm:text-xs font-bold text-red-400 truncate max-w-full sm:max-w-[62%] min-h-[16px] flex items-center gap-1';
                el.innerHTML = `<i class="fa-solid fa-circle-xmark"></i><span>${escapeHtml(msg)}</span>`;
            } else if (type === 'info') {
                el.className = 'text-[11px] sm:text-xs font-bold text-sky-400 truncate max-w-full sm:max-w-[62%] min-h-[16px] flex items-center gap-1';
                el.innerHTML = `<i class="fa-solid fa-flag-checkered"></i><span>${escapeHtml(msg)}</span>`;
            } else {
                el.className = 'text-[11px] sm:text-xs font-bold text-gray-400 truncate max-w-full sm:max-w-[62%] min-h-[16px] flex items-center gap-1';
                el.innerHTML = `<i class="fa-solid fa-circle-info text-amber-400"></i><span>${escapeHtml(msg)}</span>`;
            }
        }

        // ==================== イベントリスナー登録 ====================
        window.addEventListener('DOMContentLoaded', () => {
            // 1. 同階層の rider.csv 自動ロード
            loadInitialCsvData();

            // 2. ゲーム開始・ギブアップ・リセット
            document.getElementById('startBtn').addEventListener('click', startGame);
            document.getElementById('giveUpBtn').addEventListener('click', giveUpGame);
            document.getElementById('resetBtn').addEventListener('click', resetGame);

            // 3. チェックボックス連動ロジック
            const chkSeriesSort = document.getElementById('chkSeriesSort');
            const chkVisualOnly = document.getElementById('chkVisualOnly');
            const chkNovelOnly = document.getElementById('chkNovelOnly');
            const chkStageOnly = document.getElementById('chkStageOnly');
            const chkGameOnly = document.getElementById('chkGameOnly');

            // シリーズソートはプレイ中でもリアルタイム切り替え可能
            chkSeriesSort.addEventListener('change', () => {
                filterSeriesSort = chkSeriesSort.checked;
                renderGrid();
            });

            // 「映像化作品のみ」にチェックを入れたら → 小説・舞台・ゲーム限定のチェックを自動的に外す
            chkVisualOnly.addEventListener('change', () => {
                filterVisualOnly = chkVisualOnly.checked;
                if (filterVisualOnly) {
                    chkNovelOnly.checked = false;
                    chkStageOnly.checked = false;
                    chkGameOnly.checked = false;
                    filterNovelOnly = false;
                    filterStageOnly = false;
                    filterGameOnly = false;
                }
                buildWorkFilterOptions();
                updateCheckboxCounts();
                renderGrid();
            });

            // 「小説限定」「舞台限定」「ゲーム限定」のチェック変更時は「映像化作品のみ」のチェックを外さずそのまま反映する
            const handleLimitedCheckboxChange = () => {
                filterNovelOnly = chkNovelOnly.checked;
                filterStageOnly = chkStageOnly.checked;
                filterGameOnly = chkGameOnly.checked;
                buildWorkFilterOptions();
                updateCheckboxCounts();
                renderGrid();
            };

            chkNovelOnly.addEventListener('change', handleLimitedCheckboxChange);
            chkStageOnly.addEventListener('change', handleLimitedCheckboxChange);
            chkGameOnly.addEventListener('change', handleLimitedCheckboxChange);

            // 作品ごとのフィルター変更イベント
            document.getElementById('workFilterSelect').addEventListener('change', (e) => {
                if (gameStatus === 'PLAYING') {
                    showFeedback('プレイ中は作品フィルターを変更できません。リセット後に変更してください。', 'warn');
                    e.target.value = currentWorkFilter;
                    return;
                }
                currentWorkFilter = e.target.value;
                updateCheckboxCounts();
                renderGrid();
            });

            // 4. 入力欄のイベント（自動判定 & Enter送信）
            const riderInput = document.getElementById('riderInput');
            let isComposing = false;

            riderInput.addEventListener('compositionstart', () => {
                isComposing = true;
            });
            riderInput.addEventListener('compositionend', () => {
                isComposing = false;
                if (document.getElementById('autoSubmitToggle').checked) {
                    checkAnswer(riderInput.value, false);
                }
            });
            riderInput.addEventListener('input', () => {
                if (!isComposing && document.getElementById('autoSubmitToggle').checked) {
                    checkAnswer(riderInput.value, false);
                }
            });
            riderInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !isComposing) {
                    e.preventDefault();
                    checkAnswer(riderInput.value, true);
                }
            });
            document.getElementById('submitAnswerBtn').addEventListener('click', () => {
                checkAnswer(riderInput.value, true);
                riderInput.focus();
            });

            // 5. 回答状態フィルター
            document.getElementById('statusFilterSelect').addEventListener('change', (e) => {
                currentStatusFilter = e.target.value;
                renderGrid();
            });

            // 6. ヒント表示トグル（ONにすると未回答ヒント＋映画初出タグが表示される）
            const hintBtn = document.getElementById('hintToggleBtn');
            hintBtn.addEventListener('click', () => {
                showHints = !showHints;
                hintBtn.innerHTML = showHints 
                    ? `<i class="fa-solid fa-lightbulb text-amber-300"></i><span>ヒント: ON</span>`
                    : `<i class="fa-regular fa-lightbulb"></i><span>ヒント: OFF</span>`;
                hintBtn.classList.toggle('bg-amber-950/70', showHints);
                hintBtn.classList.toggle('border-amber-500/60', showHints);
                renderGrid();
            });

            // 7. グリッドサイズ切り替え
            document.querySelectorAll('.size-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    currentGridSize = btn.getAttribute('data-size');
                    document.querySelectorAll('.size-btn').forEach(b => {
                        b.className = 'size-btn px-2 py-1 rounded text-xs text-gray-400 hover:text-white transition';
                    });
                    btn.className = 'size-btn px-2 py-1 rounded text-xs bg-gray-700 text-white transition';
                    renderGrid();
                });
            });

            // 8. 音声ON/OFF切り替え
            document.getElementById('soundToggleBtn').addEventListener('click', () => {
                soundEnabled = !soundEnabled;
                const icon = document.getElementById('soundIcon');
                icon.className = soundEnabled ? 'fa-solid fa-volume-high' : 'fa-solid fa-volume-xmark text-gray-500';
            });

            // 9. クリアモーダル操作＆X（旧Twitter）で記録をシェア
            const clearModal = document.getElementById('clearModal');
            document.getElementById('closeClearModalBtn').addEventListener('click', () => {
                clearModal.classList.add('hidden');
                clearModal.classList.remove('flex');
            });
            document.getElementById('playAgainBtn').addEventListener('click', () => {
                clearModal.classList.add('hidden');
                clearModal.classList.remove('flex');
                resetGame();
                startGame();
            });
            document.getElementById('shareResultBtn').addEventListener('click', () => {
                const timeStr = document.getElementById('modalClearTime').textContent;
                const activePool = getActiveQuizRiders();
                const totalCleared = activePool.length;
                const rangeLabel = getQuizRangeLabel(totalCleared);
                const pageUrl = window.location.href;

                const shareText = `【仮面ライダー言えるかな？】\n${totalCleared}人を${timeStr}でクリアしました！\n出題範囲:${rangeLabel}\n${pageUrl}`;

                // クリップボードにもバックアップコピー
                try {
                    const tempInput = document.createElement('textarea');
                    tempInput.value = shareText;
                    document.body.appendChild(tempInput);
                    tempInput.select();
                    document.execCommand('copy');
                    document.body.removeChild(tempInput);
                } catch (e) {}

                // X (Twitter) のポスト画面を開く
                const tweetUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}`;
                window.open(tweetUrl, '_blank', 'noopener,noreferrer');
            });
        });
    </script>
